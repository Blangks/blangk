<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Hub: Forest Frontier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
<canvas id="world"></canvas><canvas id="mini"></canvas>
<div id="hud">
  <div class="topbar"><div class="brand">THE HUB<small>Forest Frontier</small></div><div class="stat"><span>District</span><strong id="district">Central Plaza</strong></div><div class="stat"><span>World</span><strong id="worldState">Clear • Morning</strong></div><div class="stat"><span>Quest</span><strong id="questShort">Meet the Archivist</strong></div></div>
  <div id="hearts"></div><div id="objective"><div class="objective-label">Current objective</div><div class="objective-text" id="objectiveText"></div></div>
  <div id="prompt"></div><div id="toast"></div><div id="dialog"><span id="dialogText"></span><span class="hint">Tap or press E</span></div><div id="help">WASD / arrows move • E interact • Space attack • Shift roll • M map</div>
</div>
<div id="mobile"><div id="stick" class="touch"><div id="knob"></div></div><div id="cameraPad" class="touch"></div><div id="actions"><button id="attack" class="touch">⚔</button><button id="roll" class="touch">↯</button><button id="interact" class="touch">A</button><button id="mapBtn" class="touch">M</button></div></div>
</div>
<script src="game.js"></script>
</body>
</html>
